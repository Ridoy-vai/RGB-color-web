    <h1>🌎 𝐂𝐨𝐥𝐨𝐫✦𝐙𝐞𝐧 🎨</h1>

    <div class="controls-container">
        <div class="search-box">
            <input type="text" id="searchBox" placeholder="#FF5733">
            <button id="searchBtn" class="btn" onclick="searchColor()">🔍</button>
        </div>
        <button id="mixBtn" class="btn" onclick="toggleMix()">🎨 Color Mixer</button>
        <button id="gradBtn" class="btn" onclick="generateRandomGradient()">🌈 Random Gradient</button>
    </div>

    <div id="colorGrid" class="color-grid"></div>

    <div id="mixPopup">
        <h3>🎨 Blend Colors</h3>
        <input type="text" id="color1" placeholder="#FF0000" style="padding:8px; border-radius:5px;"><br><br>
        <input type="text" id="color2" placeholder="#0000FF" style="padding:8px; border-radius:5px;"><br><br>
        <button class="btn" style="background:#222;" onclick="mixColors()">Mix Now</button>
        <div id="mixResult">Result</div>
        <button class="btn" style="background:green;" onclick="saveMixedColor()">Save & Add</button>
        <button class="btn" style="background:red;" onclick="toggleMix()">Close</button>
    </div>

    <div id="fullScreen">
        <div id="fsDisplay"></div>
        <button onclick="closeFS()" style="position:absolute; top:20px; right:20px; padding:12px; background:red; border:none; color:white; border-radius:50%; cursor:pointer;">✖</button>
        
        <button class="nav-btn prev-btn" onclick="changeColor(-1)">❮</button>
        <button class="nav-btn next-btn" onclick="changeColor(1)">❯</button>

        <div class="info-panel">
            <h2 id="hexLabel">#FFFFFF</h2>
            <button class="btn" style="background:#007BFF;" onclick="copyCode()">Copy Code</button>
            <button class="btn" style="background:#28a745; margin-left:10px;" onclick="handleDownload()">Download PNG</button>
        </div>
    </div>
